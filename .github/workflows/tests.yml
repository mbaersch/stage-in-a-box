# Prüft jeden Push und Pull Request: TypeScript, Recorder, Unit-Tests der Bibliothek und die
# Beispieltests gegen die Demo-Seite, ohne und mit Proxy. Keine echten Websites, keine Zugangsdaten.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run pruefen

      - name: Recorder-Build ist aktuell
        run: sh build.sh && git diff --exit-code dist/

      - name: Recorder
        run: npm run test:recorder

      - name: Unit-Tests und Beispieltests
        run: npm test

      - name: Beispieltests mit Proxy
        run: npm test -- --project=chromium
        env:
          PROXY: ein

      - name: Report bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: beispiel/playwright-report
          retention-days: 7
