# Prüft jeden Push und Pull Request: TypeScript, Recorder, Unit-Tests der Bibliothek und die
# Beispieltests gegen die Demo-Seite, ohne und mit Proxy, dazu den Abgleich der Dienst-Erkennung mit den
# Schwesterprojekten. Keine echten Websites, keine Zugangsdaten.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run pruefen

      - name: Recorder-Build ist aktuell
        run: sh build.sh && git diff --exit-code dist/

      - name: Recorder
        run: npm run test:recorder

      - name: Unit-Tests und Beispieltests
        run: npm test

      - name: Beispieltests mit Proxy
        run: npm test -- --project=chromium
        env:
          PROXY: ein

      - name: Report bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: beispiel/playwright-report
          retention-days: 7

  # Dienst-Erkennung gegen die Schwesterprojekte (abgleich/README.md im tracking-auditor). Eigener Job:
  # Bei einer Änderung über mehrere Repos ist er rot, bis alle nachgezogen sind; die Tests bleiben davon unberührt.
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: tracking-auditor (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/tracking-auditor
          path: tracking-auditor
      - name: tracking-auditor-extension (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/tracking-auditor-extension
          path: tracking-auditor-extension
      - name: ec-data-validator (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/ec-data-validator
          path: ec-data-validator
      - name: Dieses Repo (stage-in-a-box)
        uses: actions/checkout@v7
        with:
          path: stage-in-a-box

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Abgleich
        run: node tracking-auditor/abgleich/abgleich.js --extension tracking-auditor-extension --validator ec-data-validator --stage stage-in-a-box
